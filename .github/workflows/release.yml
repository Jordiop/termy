# Every merge to main:
#   1. clippy + tests on Linux (cheapest runner; stops here on failure)
#   2. builds the macOS .dmg
#   3. publishes a GitHub Release with the next version number
#
# Versioning: MAJOR.MINOR come from Cargo.toml, PATCH increments on every
# release (v0.1.0, v0.1.1, v0.1.2…). To start 0.2.x, set version = "0.2.0"
# in Cargo.toml.
#
# Windows (.zip) and Linux (.tar.gz) builds are optional: run this workflow
# by hand (Actions → Release → Run workflow) with "all platforms" ticked.
name: Release

on:
  push:
    branches: [main]
    # Docs-only changes don't produce a release.
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Also build Windows and Linux packages
        type: boolean
        default: false

# Releases run one at a time so two merges never get the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags

      - id: next
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          major_minor=${base%.*}
          last=$(git tag -l "v${major_minor}.*" | sort -V | tail -1)
          if [ -z "$last" ]; then
            next=$base
          else
            patch=${last##*.}
            next="${major_minor}.$((patch + 1))"
          fi
          echo "Last release: ${last:-none} → next: v${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

  test:
    name: clippy + tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  macos:
    name: macOS .dmg
    needs: [version, test]
    runs-on: macos-14
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Stamp the release version into Cargo.toml so the binary, Info.plist
      # and the .dmg name all carry it (not committed back).
      - name: Set version ${{ env.VERSION }}
        run: sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
      - run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: termy-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  others:
    name: ${{ matrix.name }}
    needs: [version, test]
    if: github.event_name == 'workflow_dispatch' && inputs.all_platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows .zip
            os: windows-latest
          - name: Linux .tar.gz
            os: ubuntu-22.04 # older glibc → runs on more distros
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set version ${{ env.VERSION }}
        shell: bash
        run: sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
      # ConPTY code paths only run here.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test
      - name: Package
        shell: bash
        run: |
          cargo build --release
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "dist/termy-${VERSION}-windows-x86_64.zip" ./target/release/termy.exe README.md
          else
            mkdir -p "dist/termy-${VERSION}"
            cp target/release/termy README.md "dist/termy-${VERSION}/"
            tar -C dist -czf "dist/termy-${VERSION}-linux-x86_64.tar.gz" "termy-${VERSION}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: termy-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, macos, others]
    # Publish when macOS succeeded and the optional builds didn't fail.
    if: always() && needs.macos.result == 'success' && needs.others.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: termy v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
